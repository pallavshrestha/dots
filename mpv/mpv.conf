osd-font-size=30
sub-scale=0.4
hwdec=auto
profile=1080p

[nodir]
sub-auto=no
audio-file-auto=no

[image]
profile=nodir
profile=opengl-hq
mute=yes
scale=ewa_lanczossharp
# background=0.1
input-conf=~~/input-image.conf
video-unscaled=yes
title="mvi - ${?media-title:${media-title}}${!media-title:No file}"
image-display-duration=inf
loop-file=yes

[extension.gif]
interpolation=no

# Ignore aspect ratio information for PNG and JPG, because it's universally bust
[extension.png]
# video-aspect=no

[extension.jpg]
# video-aspect=no

[extension.jpeg]
# profile=extension.jpg


[nodir]
sub-auto=no
audio-file-auto=no

[image]
profile=nodir
profile=opengl-hq
mute=yes
scale=ewa_lanczossharp
# background=0.1
input-conf=~~/input-image.conf
video-unscaled=yes
title="mvi - ${?media-title:${media-title}}${!media-title:No file}"
image-display-duration=inf
loop-file=yes

[extension.gif]
interpolation=no

# Ignore aspect ratio information for PNG and JPG, because it's universally bust
[extension.png]
# video-aspect=no

[extension.jpg]
# video-aspect=no

[extension.jpeg]
# profile=extension.jpg

[1440p]
ytdl-format=(bestvideo[height<=?1440][vcodec!*=av01]+bestaudio/best[height<=?1440][vcodec!*=av01])
# profile=fast

[1080p]
ytdl-format=(bestvideo[height<=?1080][vcodec!*=av01]+bestaudio/best[height<=?1080][vcodec!*=av01])
# profile=fast

[720p]
ytdl-format=(bestvideo[height<=?720][vcodec!*=av01]+bestaudio/best[height<=?720][vcodec!*=av01])

[480p]
ytdl-format=(bestvideo[height<=?480][vcodec!*=av01]+bestaudio/best[height<=?480][vcodec!*=av01])

[360p]
ytdl-format=(bestvideo[height<=?360][vcodec!*=av01]+bestaudio/best[height<=?360][vcodec!*=av01])
